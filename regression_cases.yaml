# =====================================================================
# Filter regression cases — checked by guard.py before EVERY scan publishes.
#
# If any case gives the wrong answer the scan stops, Telegram gets a crash
# alert, and the dashboard keeps its last good data. Add a case whenever a
# new leak (or a wrongly-dropped comp) is found, so it can never come back.
#
#   expect: keep | drop        type: optional, checked when expect is keep
#   link / body: optional — some leaks were only visible there
# =====================================================================


      <p>Promotion period: 27 October 2026, 18:00 to 3 November 2026, 18:00 (UTC+8).</p>
      <p>Exclusive pool (new users) 200,000 DNA. DNA spot trading pool (all users) 700,000 DNA.
      Futures trading pool (new futures users only) 100,000 DNA.</p>
      <p>How to participate: register, then complete the trading tasks below during the promotion period.
      Rewards are distributed within 7 working days after the event ends. Bitget reserves the right of final interpretation.</p></div>
